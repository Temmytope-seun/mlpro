{% extends "base.html" %}
{% block title %}{{ code }} — Student Performance Predictor{% endblock %}

{% block content %}
<section class="error-shell">
    <div class="container">
        <div class="error-code">{{ code }}</div>
        <h3 class="mt-3">{{ title }}</h3>
        <p class="text-muted">{{ message }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-gradient mt-3 px-4">
            <i class="bi bi-house-door me-2"></i>Back to Home
        </a>
    </div>
</section>
{% endblock %}
